{% extends 'base.html' %}
{% block title %}Sign In — Smart Cinema Ticket Hub{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto; padding: 2.5rem; background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: var(--shadow-lg);">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="width: 52px; height: 52px; background: linear-gradient(135deg, var(--primary), #ef4444); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem; box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);">🎬</div>
    <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Welcome Back</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Log in to book tickets and review movies</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" style="display: flex; flex-direction: column; gap: 1.25rem;">
    <div>
      <label for="email" style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="your.email@example.com" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.95rem;">
    </div>

    <div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
        <label for="password" style="font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Password</label>
        <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
      </div>
      <input type="password" id="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.95rem;">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; font-size: 1rem;">Sign In</button>
  </form>

  <!-- Demo Viva Helper Buttons (Supported by static/js/main.js) -->
  <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); text-align: center;">
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;">Demo Login Shortcuts (Viva Demonstration)</p>
    <div style="display: flex; gap: 0.5rem; justify-content: center;">
      <button type="button" id="demoAdminBtn" class="btn btn-secondary btn-sm" style="font-size: 0.8rem;">⚡ Fill Admin</button>
      <button type="button" id="demoCustomerBtn" class="btn btn-secondary btn-sm" style="font-size: 0.8rem;">⚡ Fill User</button>
    </div>
  </div>

  <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 1.5rem;">
    Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one here</a>
  </p>
</div>
{% endblock %}
