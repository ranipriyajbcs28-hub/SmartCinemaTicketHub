{% extends 'base.html' %}
{% block title %}Edit {{ movie.title }} — Admin Portal{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1.5rem;">
  
  <div style="margin-bottom: 2rem;">
    <a href="{{ url_for('admin.manage_movies') }}" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">&larr; Back to Movies</a>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-primary); margin-top: 0.25rem;">Edit Movie: {{ movie.title }}</h1>
  </div>

  <div style="background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 2rem;">
    <form method="POST" action="{{ url_for('admin.edit_movie', movie_id=movie.movie_id) }}" enctype="multipart/form-data" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
      <div style="grid-column: 1 / -1;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Movie Title</label>
        <input type="text" name="title" value="{{ movie.title }}" required style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Language</label>
        <input type="text" name="language" value="{{ movie.language }}" required style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Genre</label>
        <input type="text" name="genre" value="{{ movie.genre }}" required style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Duration (mins)</label>
        <input type="number" name="duration" value="{{ movie.duration }}" required style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Release Date (YYYY-MM-DD)</label>
        <input type="date" name="release_date" value="{{ movie.release_date_str }}" required style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <div>
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Rating (0.0 to 5.0)</label>
        <input type="number" step="0.1" name="rating" value="{{ movie.rating }}" style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <!-- Poster Picture Upload Section -->
      <div style="grid-column: 1 / -1; background: var(--bg-main); border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 1.25rem;">
        <label style="display: block; font-weight: 700; font-size: 0.9rem; color: var(--text-primary); margin-bottom: 0.75rem;">
          📷 Movie Poster Picture
        </label>
        
        <div style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem;">
          {% if movie.poster %}
          <div style="text-align: center;">
            <img id="currentPosterImg" src="{{ movie.poster }}" alt="{{ movie.title }}" style="width: 70px; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: block; margin-bottom: 0.25rem;">
            <span style="font-size: 0.7rem; color: var(--text-muted);">Current Poster</span>
          </div>
          {% endif %}

          <div style="flex: 1; min-width: 250px;">
            <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 0.35rem;">Upload New Poster Image File:</label>
            <input type="file" name="poster_file" id="edit_poster_file" accept="image/*" style="width: 100%; padding: 0.65rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
          </div>
        </div>

        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Or Image URL:</label>
          <input type="url" name="poster" value="{{ movie.poster or '' }}" placeholder="https://..." style="width: 100%; padding: 0.55rem 0.85rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.85rem;">
        </div>
      </div>

      <div style="grid-column: 1 / -1;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Trailer URL</label>
        <input type="url" name="trailer" value="{{ movie.trailer or '' }}" style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">
      </div>

      <div style="grid-column: 1 / -1;">
        <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Description</label>
        <textarea name="description" rows="4" required style="width: 100%; padding: 0.7rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);">{{ movie.description }}</textarea>
      </div>

      <div style="grid-column: 1 / -1; display: flex; gap: 1rem; margin-top: 0.5rem;">
        <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Save Changes</button>
        <a href="{{ url_for('admin.manage_movies') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
