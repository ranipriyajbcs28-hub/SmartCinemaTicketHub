{% extends 'base.html' %}
{% block title %}User Profile — Smart Cinema Ticket Hub{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 3rem auto; padding: 0 1.5rem;">
  <div style="background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 72px; height: 72px; background: linear-gradient(135deg, var(--primary), #ea580c); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; margin: 0 auto 1rem;">
        {{ user.name[0] | upper }}
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.25rem;">{{ user.name }}</h1>
      <span style="font-size: 0.8rem; padding: 0.2rem 0.65rem; border-radius: 9999px; font-weight: 700;
        {% if user.role == 'ADMIN' %}background: var(--primary); color: #000;
        {% else %}background: var(--info-bg); color: var(--info);{% endif %}">
        {{ user.role }}
      </span>
    </div>

    <!-- Profile Edit Form -->
    <form method="POST" action="{{ url_for('auth.profile') }}" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div>
        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Full Name</label>
        <input type="text" name="name" value="{{ user.name }}" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
      </div>

      <div>
        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
        <input type="email" value="{{ user.email }}" disabled style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-muted); cursor: not-allowed;">
        <span style="font-size: 0.75rem; color: var(--text-muted);">Email address is permanent and cannot be altered.</span>
      </div>

      <div>
        <label style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Phone Number</label>
        <input type="tel" name="phone" value="{{ user.phone or '' }}" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
      </div>

      <div style="border-top: 1px dashed var(--border); padding-top: 1.25rem;">
        <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.75rem;">Change Password (Optional)</h3>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <div>
            <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Current Password</label>
            <input type="password" name="current_password" placeholder="Leave blank if unchanged" style="width: 100%; padding: 0.7rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
          </div>
          <div>
            <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">New Password</label>
            <input type="password" name="new_password" placeholder="Minimum 6 characters" style="width: 100%; padding: 0.7rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top: 1rem; padding: 0.8rem;">Save Profile Updates</button>
    </form>

  </div>
</div>
{% endblock %}
