{% extends 'base.html' %}
{% block title %}Review {{ movie.title }} — Smart Cinema Ticket Hub{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 3rem auto; padding: 0 1.5rem;">
  <div style="background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Rate & Review</h1>
      <p style="color: var(--text-muted); font-size: 1rem;">Share your thoughts on <strong style="color: var(--primary);">{{ movie.title }}</strong></p>
      <p style="font-size: 0.8rem; color: var(--accent-cyan); margin-top: 0.25rem;">✨ Powered by Machine Learning Sentiment Classifier</p>
    </div>

    <form method="POST" action="{{ url_for('review.submit_review', movie_id=movie.movie_id) }}" style="display: flex; flex-direction: column; gap: 1.5rem;">
      <div>
        <label for="rating" style="display: block; font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem;">Rating (1 to 5 Stars)</label>
        <select id="rating" name="rating" required style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 1rem;">
          <option value="5" {% if existing_review and existing_review.rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐ (5 - Outstanding)</option>
          <option value="4" {% if existing_review and existing_review.rating == 4 %}selected{% endif %}>⭐⭐⭐⭐ (4 - Very Good)</option>
          <option value="3" {% if existing_review and existing_review.rating == 3 %}selected{% endif %}>⭐⭐⭐ (3 - Average)</option>
          <option value="2" {% if existing_review and existing_review.rating == 2 %}selected{% endif %}>⭐⭐ (2 - Below Average)</option>
          <option value="1" {% if existing_review and existing_review.rating == 1 %}selected{% endif %}>⭐ (1 - Terrible)</option>
        </select>
      </div>

      <div>
        <label for="review_text" style="display: block; font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.5rem;">Your Feedback</label>
        <textarea id="review_text" name="review_text" rows="5" required placeholder="What did you love or dislike about the acting, direction, cinematography, or soundtrack?" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.95rem; resize: vertical;">{{ existing_review.review_text if existing_review else '' }}</textarea>
      </div>

      <div style="display: flex; gap: 1rem;">
        <button type="submit" class="btn btn-primary" style="flex: 1; padding: 0.8rem; font-size: 1rem;">Submit Review</button>
        <a href="{{ url_for('movie.details', movie_id=movie.movie_id) }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
