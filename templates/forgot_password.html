{% extends 'base.html' %}
{% block title %}Reset Password — Smart Cinema Ticket Hub{% endblock %}

{% block content %}
<div class="container" style="max-width: 460px; margin: 3rem auto; padding: 0 1.5rem;">
  <div style="background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); padding: 2.5rem; box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Reset Password</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Enter your registered email and a new password</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <div>
        <label for="email" style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="your.email@example.com" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
      </div>

      <div>
        <label for="new_password" style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">New Password</label>
        <input type="password" id="new_password" name="new_password" required placeholder="Minimum 6 characters" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
      </div>

      <div>
        <label for="confirm_password" style="display: block; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter new password" style="width: 100%; padding: 0.75rem 1rem; background: var(--bg-main); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary);">
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 0.8rem; margin-top: 0.5rem;">Reset Password</button>
      <a href="{{ url_for('auth.login') }}" class="btn btn-secondary" style="text-align: center;">Back to Login</a>
    </form>

  </div>
</div>
{% endblock %}
