services:
  - type: web
    name: smart-cinema-ticket-hub
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_TYPE
        value: mongodb
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: cinemahub
      - key: FLASK_ENV
        value: production
